<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 노동자의 지갑 — 따뜻한 종이 색을 모바일 OS 크롬에도 그대로. -->
    <meta name="theme-color" content="#faf6ee" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="노동자의 지갑 — 비수탁 EVM 지갑. 시드는 절대 서버에 가지 않습니다." />

    <!-- Brand identity & social preview (Open Graph + Twitter card).
         OG image 는 1200×630 으로 페이지 미리보기(슬랙/카톡/트위터/페북) 어디서나 잘 보인다.
         apple-touch-icon 은 iOS 홈 추가 시 사용. favicon 은 32×32 PNG.  -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="노동자의 지갑" />
    <meta property="og:description" content="체인이 자유롭다면 노동자도 자유롭다 — TTL 멀티체인 지갑" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />

    <!--
      Pretendard Variable — 한국어 본문/제목 통일. CDN 으로 가볍게 시작하고,
      셋업이 안정되면 셀프호스팅으로 옮기는 것을 권장한다.
      `preconnect` 로 첫 페인트 직전에 DNS/TLS 를 끝내고, `preload` 로 woff2 자체를
      병렬 다운로드한다. fallback 은 system Korean 으로 안전하게.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>노동자의 지갑</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
