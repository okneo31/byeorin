[package]
name = "byeorin-desktop"
version = "0.1.0"
description = "벼린 — 데스크톱 (Tauri 2.x)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "byeorin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# default to web features; native + custom-protocol enabled in release.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
