<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="벼린 — ㄴ stamp">
  <title>벼린 — Concept A (ㄴ stamp)</title>

  <!-- Stamp body: rounded square with hand-stamped wobble.
       The path is a 4-corner rounded rect built from cubic beziers,
       with each side mid-anchor nudged a hair to break geometric perfection. -->
  <path
    d="M 56 22
       C 80 18 178 18 200 24
       C 232 30 236 56 236 80
       C 240 110 240 152 234 178
       C 230 210 206 234 178 236
       C 148 240 104 240 78 234
       C 48 232 22 208 20 178
       C 16 148 16 104 22 78
       C 26 48 32 26 56 22 Z"
    fill="#c41e1e"
  />

  <!-- Outer hairline ring inside the stamp for "ink edge" feel -->
  <path
    d="M 64 36
       C 86 32 172 32 192 38
       C 218 42 220 64 220 84
       C 224 110 224 148 218 172
       C 214 200 196 218 172 220
       C 146 224 110 224 84 218
       C 58 216 38 196 36 172
       C 32 146 32 108 38 86
       C 42 60 46 38 64 36 Z"
    fill="none"
    stroke="#fffaf0"
    stroke-width="2"
    opacity="0.45"
  />

  <!-- ㄴ jamo: horizontal bottom stroke + vertical left stroke joined at bottom-left.
       Hand-drawn bezier with slight brush thickening at terminals. -->
  <path
    d="M 88 64
       C 86 62 84 64 84 68
       L 84 178
       C 84 188 90 192 100 192
       L 184 192
       C 192 192 194 188 192 180
       L 188 168
       C 186 162 180 160 172 160
       L 110 160
       C 104 160 102 156 102 150
       L 102 72
       C 102 66 96 62 88 64 Z"
    fill="#fffaf0"
  />

  <!-- Yellow accent: small notch at top-right of ㄴ (sparingly used) -->
  <circle cx="200" cy="68" r="8" fill="#f4c430" />
  <circle cx="200" cy="68" r="3" fill="#c41e1e" />
</svg>
