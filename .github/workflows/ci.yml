name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # packages/* 끼리는 package.json exports 의 dist(.js/.d.ts) 로 서로를 참조한다
      # (shell-core → @byeorin/wallet-sdk/core, /multichain). clean checkout 에는 dist 가
      # 없으므로 라이브러리 빌드가 typecheck·test 보다 먼저 돌아야 한다. pnpm 은 의존
      # 순서대로 돌기 때문에 wallet-sdk 가 shell-core 보다 먼저 빌드된다.
      - name: Build (library packages)
        run: pnpm --filter "./packages/*" build

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test — @byeorin/wallet-sdk
        run: pnpm --filter @byeorin/wallet-sdk test

      - name: Test — @byeorin/shell-core
        run: pnpm --filter @byeorin/shell-core test

      - name: Build (all workspaces)
        run: pnpm -r build

  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on any high/critical advisory. Moderate/low are reported but non-blocking.
      - run: pnpm audit --prod --audit-level=high
