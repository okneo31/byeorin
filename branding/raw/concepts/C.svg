<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="노동자의 지갑 — Concept C: pickaxe + sweat + earth">
  <title>Concept C — pickaxe with sweat drop and earth fragments</title>

  <!-- Stamp body -->
  <path d="M 56 22 C 80 18 178 18 200 24 C 232 30 236 56 236 80 C 240 110 240 152 234 178 C 230 210 206 234 178 236 C 148 240 104 240 78 234 C 48 232 22 208 20 178 C 16 148 16 104 22 78 C 26 48 32 26 56 22 Z" fill="#c41e1e"/>
  <!-- Inner hairline ring -->
  <path d="M 64 36 C 86 32 172 32 192 38 C 218 42 220 64 220 84 C 224 110 224 148 218 172 C 214 200 196 218 172 220 C 146 224 110 224 84 218 C 58 216 38 196 36 172 C 32 146 32 108 38 86 C 42 60 46 38 64 36 Z" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.4"/>

  <!--
    Single diagonal pickaxe at -30° (from upper-left handle to lower-right head striking ground).
    Sweat drop in upper-left (falling from worker's brow off-frame).
    Earth fragments / dirt clumps below the strike point.
  -->
  <defs>
    <g id="pickaxeC">
      <!-- Handle: longer for this layout (-110..+70) -->
      <path d="M -110 -8 C -106 -11 -60 -10 0 -10 C 30 -10 56 -9 72 -7 L 72 7 C 56 9 30 10 0 10 C -60 10 -106 11 -110 8 C -113 6 -113 -6 -110 -8 Z" fill="#fffaf0"/>
      <!-- Wood grain -->
      <path d="M -98 0 C -50 -2 0 -1 60 0" stroke="#c41e1e" stroke-width="1.3" opacity="0.25" fill="none"/>
      <!-- Iron head -->
      <path d="M 78 -86
               L 96 -76
               C 100 -54 100 -28 100 -8
               C 106 -6 108 -2 108 0
               C 108 2 106 6 100 8
               C 100 26 102 46 104 56
               L 88 62
               L 76 36
               L 70 12
               L 66 0
               L 70 -12
               L 76 -36
               L 78 -86 Z"
            fill="#fffaf0"/>
    </g>
  </defs>

  <!-- Pickaxe diagonal (-30° rotation), head down-right, handle up-left -->
  <g transform="translate(120 128) rotate(-30) scale(0.78)">
    <use href="#pickaxeC"/>
  </g>

  <!-- Sweat drop: yellow with white highlight, upper-right area -->
  <path d="M 192 64 C 192 56 198 50 200 50 C 202 50 208 56 208 64 C 208 72 204 78 200 78 C 196 78 192 72 192 64 Z" fill="#f4c430"/>
  <path d="M 196 60 C 196 58 198 56 200 56 C 200 58 198 60 196 60 Z" fill="#fffaf0" opacity="0.8"/>

  <!-- Earth fragments below strike point -->
  <ellipse cx="86" cy="208" rx="14" ry="6" fill="#fffaf0" opacity="0.85"/>
  <circle cx="108" cy="216" r="5" fill="#fffaf0" opacity="0.78"/>
  <circle cx="64" cy="218" r="4" fill="#fffaf0" opacity="0.7"/>
  <circle cx="124" cy="220" r="3" fill="#fffaf0" opacity="0.65"/>
</svg>
