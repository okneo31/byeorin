<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="노동자의 지갑 — Concept B: crossed pickaxes">
  <title>Concept B — crossed pickaxes (miners' guild)</title>

  <!-- Stamp body: rounded square with hand-stamped wobble. -->
  <path d="M 56 22 C 80 18 178 18 200 24 C 232 30 236 56 236 80 C 240 110 240 152 234 178 C 230 210 206 234 178 236 C 148 240 104 240 78 234 C 48 232 22 208 20 178 C 16 148 16 104 22 78 C 26 48 32 26 56 22 Z" fill="#c41e1e"/>
  <!-- Inner hairline ring -->
  <path d="M 64 36 C 86 32 172 32 192 38 C 218 42 220 64 220 84 C 224 110 224 148 218 172 C 214 200 196 218 172 220 C 146 224 110 224 84 218 C 58 216 38 196 36 172 C 32 146 32 108 38 86 C 42 60 46 38 64 36 Z" fill="none" stroke="#fffaf0" stroke-width="2" opacity="0.4"/>

  <!--
    Pickaxe unit (handle on -X side, head on +X side).
    PICK: long sharp triangular tooth extending from socket in the -Y direction (~85 units long).
    CHISEL: shorter blunter wedge extending in +Y direction (~50 units, with a slight flat edge).
    Socket: small rounded boss around handle entry.
  -->
  <defs>
    <g id="pickaxe">
      <!-- Wooden handle (tapered with hand-stamped wobble) -->
      <path d="M -100 -8 C -96 -11 -50 -10 0 -10 C 30 -10 56 -9 72 -7 L 72 7 C 56 9 30 10 0 10 C -50 10 -96 11 -100 8 C -103 6 -103 -6 -100 -8 Z" fill="#fffaf0"/>
      <!-- Wood grain accent -->
      <path d="M -88 0 C -50 -2 0 -1 60 0" stroke="#c41e1e" stroke-width="1.3" opacity="0.25" fill="none"/>
      <!-- Butt cap -->
      <path d="M -98 -6 C -100 -2 -100 2 -98 6" stroke="#c41e1e" stroke-width="1.2" opacity="0.28" fill="none"/>

      <!-- IRON HEAD: one closed path.
           Walk clockwise from PICK tip → right side of pick → right side of chisel → CHISEL tip
            → left side of chisel → left of pick → back to tip.
           Numbers carefully chosen so pick is ~85 long and 14 wide at socket; chisel ~50 long, 22 wide. -->
      <path d="M 78 -86
               L 96 -76
               C 100 -54 100 -28 100 -8
               C 106 -6 108 -2 108 0
               C 108 2 106 6 100 8
               C 100 26 102 46 104 56
               L 88 62
               L 76 36
               L 70 12
               L 66 0
               L 70 -12
               L 76 -36
               L 78 -86 Z"
            fill="#fffaf0"/>
    </g>
  </defs>

  <!-- Pickaxe 1: head upper-right (rotate -45°) -->
  <g transform="translate(128 134) rotate(-45) scale(0.82)">
    <use href="#pickaxe"/>
  </g>
  <!-- Pickaxe 2: head upper-left (rotate -135°) -->
  <g transform="translate(128 134) rotate(-135) scale(0.82)">
    <use href="#pickaxe"/>
  </g>

  <!-- Sparks above the strike point -->
  <circle cx="128" cy="58" r="6" fill="#f4c430"/>
  <circle cx="128" cy="58" r="2" fill="#c41e1e"/>
  <circle cx="102" cy="50" r="3" fill="#fffaf0" opacity="0.92"/>
  <circle cx="154" cy="50" r="3" fill="#fffaf0" opacity="0.92"/>
  <circle cx="120" cy="38" r="1.8" fill="#fffaf0" opacity="0.75"/>
  <circle cx="136" cy="38" r="1.8" fill="#fffaf0" opacity="0.75"/>
</svg>
