# 노동자의 지갑 Cold — Zephyr application config.
#
# Keep this file lean: anything truly board-specific belongs in the overlay,
# anything dev-only (e.g. shell, RTT verbose) belongs in a separate
# prj_debug.conf overlay (added later).

# --- Core kernel ---------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_EVENTS=y
CONFIG_POLL=y
CONFIG_REBOOT=y

# --- Logging -------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Production firmware ships WITHOUT a shell — interactive debugging only
# via the JTAG/RTT path on the dev board.
CONFIG_SHELL=n
CONFIG_CONSOLE=y

# --- Storage / settings --------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- GPIO / pinctrl / busses --------------------------------------------
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_SPI=y

# --- USB stack (CDC + HID) ----------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Nodong Cold Wallet"
CONFIG_USB_DEVICE_MANUFACTURER="Nodong"
CONFIG_USB_DEVICE_VID=0x2C97
CONFIG_USB_DEVICE_PID=0x1011
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# --- Bluetooth (Peripheral only) ----------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NodongCold"
CONFIG_BT_DEVICE_APPEARANCE=192
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_BONDABLE=y

# --- Crypto (mbedTLS subset, only what MCUBoot signature verify needs) --
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y

# --- MCUBoot integration (signed images, swap-move) ---------------------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMAGE_VERSION="0.0.1+0"
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# --- Power / watchdog ---------------------------------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_WATCHDOG=y

# --- Application-private Kconfig ----------------------------------------
# (defined in app/Kconfig)
CONFIG_NODONG_SE050_ADDR=0x48
CONFIG_NODONG_BLE_NAME="NodongCold"
CONFIG_NODONG_USB_HID_REPORT_LEN=64
CONFIG_NODONG_FIRMWARE_VERSION_STRING="0.0.1-dev"
CONFIG_NODONG_CONFIRM_TIMEOUT_SEC=45
