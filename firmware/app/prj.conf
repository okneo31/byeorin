# 벼린 요세 — Zephyr application config.
#
# Keep this file lean: anything truly board-specific belongs in the overlay,
# anything dev-only (e.g. shell, RTT verbose) belongs in a separate
# prj_debug.conf overlay (added later).

# --- Core kernel ---------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_EVENTS=y
CONFIG_POLL=y
CONFIG_REBOOT=y

# --- Logging -------------------------------------------------------------
# This is the PRODUCTION config. A debug overlay (prj_debug.conf) flips
# CONFIG_LOG_DEFAULT_LEVEL up, re-enables CONSOLE, and turns on
# CONFIG_ASSERT for engineering builds — never ship a release built with
# the debug overlay.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Level 2 = warning. Anything info/debug could leak address material or
# state into the RTT/UART backend; release builds must not emit it.
CONFIG_LOG_DEFAULT_LEVEL=2
# No shell, no interactive console: production firmware exposes only the
# USB-HID APDU surface and (optionally) BLE GATT. RTT-via-JTAG is the
# engineering escape hatch, gated by hardware access to the SWD pads.
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
# Sensitive-data logs (digests, derived pubkeys) are no-ops unless
# CONFIG_BYEORIN_LOG_SENSITIVE is also enabled — keep that off for release.
# CONFIG_BYEORIN_LOG_SENSITIVE is not set

# --- Asserts / debug ----------------------------------------------------
# Release builds must NOT carry asserts: they can panic the device in the
# field on conditions the bench build would simply log. Engineering builds
# use prj_debug.conf which sets CONFIG_ASSERT=y + CONFIG_DEBUG=y.
CONFIG_ASSERT=n
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
CONFIG_THREAD_NAME=n

# --- Storage / settings --------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- GPIO / pinctrl / busses --------------------------------------------
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_SPI=y

# --- USB stack (CDC + HID) ----------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Byeorin Yose Wallet"
CONFIG_USB_DEVICE_MANUFACTURER="Byeorin"
CONFIG_USB_DEVICE_VID=0x2C97
CONFIG_USB_DEVICE_PID=0x1011
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
# Enable the HID interrupt-OUT endpoint so OUT reports arrive via
# hid_int_ep_read() rather than only via SET_REPORT control transfers.
# Both paths funnel into hid_on_report_out() in usb_hid.c.
CONFIG_ENABLE_HID_INT_OUT_EP=y

# --- Bluetooth (Peripheral only) ----------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ByeorinYose"
CONFIG_BT_DEVICE_APPEARANCE=192
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_BONDABLE=y
# Peripheral-only profile: no GATT client, no central role.
CONFIG_BT_GATT_CLIENT=n
# We need bt_gatt_cb_register for MTU updates; pulled in by default
# when CONFIG_BT_GATT is on, but pin it explicitly for clarity.
CONFIG_BT_GATT_DYNAMIC_DB=n
# bt_conn_auth_info_cb support
CONFIG_BT_CONN=y

# --- Crypto (mbedTLS subset, only what MCUBoot signature verify needs) --
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y

# --- MCUBoot integration (signed images, swap-move) ---------------------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMAGE_VERSION="0.0.1+0"
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE=""
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# --- Power / watchdog ---------------------------------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_WATCHDOG=y

# --- Application-private Kconfig ----------------------------------------
# (defined in app/Kconfig)
CONFIG_BYEORIN_SE050_ADDR=0x48
CONFIG_BYEORIN_BLE_NAME="ByeorinYose"
CONFIG_BYEORIN_USB_HID_REPORT_LEN=64
CONFIG_BYEORIN_FIRMWARE_VERSION_STRING="0.0.1-dev"
CONFIG_BYEORIN_CONFIRM_TIMEOUT_SEC=60
# Defence in depth: SIGN_HASH refused over BLE unless explicitly opted in.
CONFIG_BYEORIN_ALLOW_BLE_SIGNING=n
